# Pages deployment follows https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Run the full browser suite (heavy)
        type: boolean
        default: false
      preview_pr:
        description: PR number for a preview, empty for the main site
        type: string
        default: ''
      publish:
        description: Publish to Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:light
      - name: Install browsers (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Audio output for Firefox
        if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tests
          pactl set-default-sink tests
      - name: Full browser tests (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
        run: xvfb-run -a pnpm test:browser
      - name: Archive tagged sources
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir classroom
          cp dist/*.html classroom/
          git archive --format=zip --prefix=sources/ --output=classroom/sources.zip HEAD
      - name: Classroom files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: classroom-${{ github.ref_name }}
          path: classroom/
          if-no-files-found: error
      - name: Validate preview number
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.preview_pr != ''
        env:
          PREVIEW_PR: ${{ inputs.preview_pr }}
        run: '[[ "$PREVIEW_PR" =~ ^[1-9][0-9]*$ ]]'
      - name: Published release sources
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.preview_pr != ''
        uses: actions/checkout@v7
        with:
          ref: bd3f2b256d58956fdffa437a91688c22f11c8999 # v1.0.0
          path: .pages-release
      - name: Build published release and add preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.preview_pr != ''
        env:
          PREVIEW_PR: ${{ inputs.preview_pr }}
        run: |
          pnpm --dir .pages-release install --frozen-lockfile
          BUILD_DIR=../pages pnpm --dir .pages-release build
          mkdir -p "pages/pr/$PREVIEW_PR"
          cp dist/*.html "pages/pr/$PREVIEW_PR/"
      - name: Pages files
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.preview_pr != '' && 'pages/' || 'dist/' }}

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ inputs.preview_pr != '' && format('{0}pr/{1}/', steps.deployment.outputs.page_url, inputs.preview_pr) || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
